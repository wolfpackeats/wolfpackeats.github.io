<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Find restaurants around NC State with Wolfpack Eats.">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta http-equiv="refresh" content="3;url=/app-20260831-title-3.html">
  <title>Wolfpack Eats | Restaurants Around NC State</title>
  <style>
    :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #f4f1ea; color: #111; padding: 24px;
    }
    main {
      width: min(540px, 100%); border: 4px solid #111; background: #fff;
      box-shadow: 10px 10px 0 #cc0000; padding: 32px;
    }
    .eyebrow {
      margin: 0 0 10px; color: #cc0000; font-size: .8rem;
      font-weight: 900; letter-spacing: .16em; text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(2rem, 10vw, 4rem); line-height: .9; text-transform: uppercase; }
    p { margin: 18px 0 0; font-weight: 700; line-height: 1.45; }
    .bar { height: 10px; margin-top: 24px; background: #ddd; overflow: hidden; }
    .bar::before {
      content: ""; display: block; width: 45%; height: 100%; background: #cc0000;
      animation: load 1s ease-in-out infinite alternate;
    }
    @keyframes load { to { transform: translateX(125%); } }
    a { color: #b00000; }
    @media (prefers-reduced-motion: reduce) { .bar::before { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <main aria-live="polite">
    <p class="eyebrow">Wolfpack Eats</p>
    <h1>Loading the latest Pack</h1>
    <p>Getting the newest restaurant list and interface. Advanced Privacy Protection can stay on.</p>
    <div class="bar" aria-hidden="true"></div>
    <noscript><p><a href="/app-20260831-title-3.html">Open Wolfpack Eats</a></p></noscript>
  </main>
  <script>
    (() => {
      const fallback = "/app-20260831-title-3.html";
      const valid = (path) =>
        typeof path === "string" && /^\/app-[a-z0-9-]+\.html$/i.test(path);
      fetch("/version.json?check=" + Date.now(), { cache: "no-store" })
        .then((response) => response.ok ? response.json() : Promise.reject())
        .then((release) => window.location.replace(valid(release.path) ? release.path : fallback))
        .catch(() => window.location.replace(fallback));
    })();
  </script>
</body>
</html>
